<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#f7f5f0;--paper:#fff;--soft:#fbfaf7;--ink:#292821;--muted:#756f66;--line:#e5e0d7;--green:#4d685a;--green2:#eaf1eb;--amber:#bf7d40;--red:#b34b4b;--blue:#5d77a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px 'Plus Jakarta Sans',sans-serif}.app{max-width:1540px;margin:auto;padding:0 26px 34px}.top{height:68px;display:flex;align-items:center;gap:13px;margin:0 -26px;padding:0 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.mark{width:30px;height:30px;border-radius:9px;background:var(--green);color:white;display:grid;place-items:center;font:700 17px Georgia}.brand{font-size:18px;font-weight:800;letter-spacing:-.9px}.brand b{color:var(--green)}.project-switch{border:0;border-left:1px solid var(--line);padding:6px 14px;background:transparent;color:var(--muted);font:600 11px 'Plus Jakarta Sans';max-width:240px}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:1px solid #d9d3c8;background:#fff;color:#403c35;border-radius:7px;padding:9px 11px;font:700 11px 'Plus Jakarta Sans';cursor:pointer;transition:.15s}.btn:hover{background:#f1eee8;border-color:#aaa294}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#3d5849}.btn.ghost{border-color:transparent;background:transparent}.layout{display:grid;grid-template-columns:192px minmax(0,1fr);gap:34px;margin-top:26px}.side{position:sticky;top:94px;height:calc(100vh - 115px);display:flex;flex-direction:column}.project-note{padding:5px 7px 17px;border-bottom:1px solid var(--line)}.eyebrow{font:500 9px 'DM Mono';letter-spacing:1px;color:var(--green);text-transform:uppercase}.project-note b{font-size:13px;display:block;margin:5px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-note span{font-size:10px;color:var(--muted)}.nav{padding-top:12px;display:grid;gap:3px}.nav button{border:0;background:transparent;padding:9px 8px;text-align:left;border-radius:6px;color:var(--muted);font:700 11px 'Plus Jakarta Sans';cursor:pointer}.nav button:hover{background:#efede7;color:var(--ink)}.nav button.on{background:var(--green2);color:#365144}.nav i{font:9px 'DM Mono';font-style:normal;color:var(--green);width:20px;display:inline-block}.side-bottom{margin-top:auto}.content{min-width:0}.page-head{padding:1px 0 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.page-head h1{font-size:24px;letter-spacing:-1.1px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.card{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:18px}.card h2,.card h3{font-size:14px;letter-spacing:-.35px;margin:0}.sub{font-size:11px;color:var(--muted);line-height:1.5;margin:4px 0 0}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:18px}.stack{display:grid;gap:15px}.field{margin-top:14px}.field label{font-size:10px;font-weight:800;color:#5d584f;display:block;margin-bottom:6px}.hint{font-weight:500;color:#938c82}.input,.area,select{width:100%;background:#fff;border:1px solid #d9d3c8;border-radius:7px;color:var(--ink);padding:10px;font:12px 'Plus Jakarta Sans';outline:none}.area{resize:vertical;min-height:80px;line-height:1.5}.input:focus,.area:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px #4d685a18}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:10px;background:var(--soft);border:1px solid var(--line);border-radius:7px}.stat b{font-size:17px;display:block}.stat span{font-size:9px;color:var(--muted)}.progress{height:6px;border-radius:9px;background:#eeeae2;overflow:hidden;margin-top:11px}.progress i{height:100%;display:block;background:var(--green)}.next{margin-top:15px;padding:13px;border-radius:8px;background:var(--green2);color:#395746}.next b{font-size:11px;display:block}.next span{font-size:10px;display:block;margin-top:3px}.check{display:grid;gap:7px;margin-top:12px}.check div{padding:8px 0;border-bottom:1px solid #eeeae3;display:flex;justify-content:space-between;font-size:11px}.check .ok{color:var(--green)}.check .todo{color:var(--amber)}.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;margin-top:15px}.record{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--soft)}.record b{font-size:11px;display:block}.record p{font-size:10px;color:var(--muted);line-height:1.45;margin:5px 0}.record-actions{display:flex;gap:5px;margin-top:8px}.small{padding:6px 7px;font-size:10px}.tag{display:inline-block;padding:3px 6px;border:1px solid #b9cbbd;color:#41614e;background:#edf4ee;border-radius:4px;font:9px 'DM Mono';margin:4px 4px 0 0}.storyboard{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;margin-top:18px}.shot-list{display:grid;gap:7px;max-height:660px;overflow:auto;padding-right:2px}.shot{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;cursor:grab}.shot:hover{border-color:#aaa294}.shot.on{border-color:#6f947c;background:#f0f6f1}.shot.drag{opacity:.35}.shot-top{display:flex;justify-content:space-between;gap:8px}.shot strong{font-size:11px}.shot small{font:9px 'DM Mono';color:var(--muted)}.shot p{font-size:10px;color:var(--muted);margin:5px 0 0;line-height:1.35}.shot img{width:100%;height:68px;object-fit:cover;border-radius:5px;margin-top:8px}.shot-detail{min-width:0}.detail-title{display:flex;justify-content:space-between;gap:9px}.detail-title h2{font-size:18px}.shot-image{height:185px;background:#f3f0e9;border:1px dashed #cbc4b8;border-radius:8px;margin-top:14px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px}.shot-image img,.shot-image video{height:100%;width:100%;object-fit:cover}.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-top:15px}.tabs button{border:0;background:transparent;padding:8px 0;color:var(--muted);font:700 10px 'Plus Jakarta Sans';cursor:pointer}.tabs button.on{color:var(--green);border-bottom:2px solid var(--green)}.prompt{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:11px;color:#464138;font:10.5px/1.65 'DM Mono';min-height:180px;margin:12px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scene-head{display:flex;justify-content:space-between;align-items:center;margin-top:17px}.drop{border:1px dashed #bdb5a8;border-radius:7px;padding:12px;margin-top:9px;background:var(--soft);display:flex;gap:8px;align-items:center}.drop label{margin-left:auto;color:var(--green);font-size:10px;font-weight:800;cursor:pointer}.drop input{display:none}.matrix{width:100%;border-collapse:collapse;margin-top:13px;font-size:10px}.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:8px;text-align:left}.matrix th{color:var(--muted);font-size:9px;text-transform:uppercase}.empty{padding:17px 0;color:var(--muted);font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:#29362d;color:#fff;padding:10px 13px;border-radius:7px;font-weight:700;font-size:11px;transition:.2s;z-index:30}.toast.show{transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#29272166;z-index:20;display:none;place-items:center;padding:16px}.modal.show{display:grid}.modal-body{background:#fff;border-radius:11px;border:1px solid var(--line);padding:20px;max-width:680px;width:100%;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font-size:17px;margin:0}.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:15px 0}.template{border:1px solid var(--line);background:var(--soft);text-align:left;border-radius:7px;padding:12px;cursor:pointer}.template:hover{border-color:var(--green)}.template b{display:block;font-size:11px}.template span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.print-only{display:none}html[data-theme="night"]{color-scheme:dark}html[data-theme="night"] body,html[data-theme="night"] .app{background:#121411;color:#edf1ea}html[data-theme="night"] .top{background:#181b18;border-color:#30372f}html[data-theme="night"] .brand,html[data-theme="night"] .project-note b,html[data-theme="night"] .page-head h1,html[data-theme="night"] .card h2,html[data-theme="night"] .card h3{color:#edf1ea}html[data-theme="night"] .project-switch,html[data-theme="night"] .project-note span,html[data-theme="night"] .page-head p,html[data-theme="night"] .sub,html[data-theme="night"] .hint{color:#a7afa5}html[data-theme="night"] .layout .side{background:transparent}html[data-theme="night"] .project-note,html[data-theme="night"] .page-head{border-color:#30372f}html[data-theme="night"] .nav button{color:#a7afa5}html[data-theme="night"] .nav button:hover{background:#20241f;color:#fff}html[data-theme="night"] .nav button.on{background:#273a2e;color:#dff0e4}html[data-theme="night"] .btn{background:#20241f;color:#e9eee7;border-color:#3a4238}html[data-theme="night"] .btn:hover{background:#2b302a}html[data-theme="night"] .btn.primary{background:#5d8977;border-color:#5d8977}html[data-theme="night"] .card,html[data-theme="night"] .dashboard-hero{background:#191c18;border-color:#30372f}html[data-theme="night"] .input,html[data-theme="night"] .area,html[data-theme="night"] select{background:#121512;color:#edf1ea;border-color:#3a4238}html[data-theme="night"] .stat,html[data-theme="night"] .record,html[data-theme="night"] .shot,html[data-theme="night"] .notice,html[data-theme="night"] .prompt,html[data-theme="night"] .asset,html[data-theme="night"] .item{background:#20231f;border-color:#363d35;color:#d7dfd5}html[data-theme="night"] .tag{background:#273b2e;border-color:#52725e;color:#c0e6cb}html[data-theme="night"] .next{background:#26392d;color:#d2e6d7}html[data-theme="night"] .progress{background:#2a302a}html[data-theme="night"] .shot.on{background:#273b2e;border-color:#6d977b}@media(max-width:900px){.app{padding:0 14px 26px}.top{margin:0 -14px;padding:0 14px}.layout{display:block;margin-top:16px}.side{height:auto;position:static}.project-note{display:none}.nav{display:flex;overflow:auto;padding:0;margin-bottom:16px}.nav button{white-space:nowrap}.side-bottom{display:none}.storyboard{grid-template-columns:1fr}.shot-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:260px}.grid{grid-template-columns:1fr}.top-actions .btn:not(.primary){display:none}}@media(max-width:560px){.top{height:60px}.brand{font-size:16px}.project-switch{display:none}.stats{grid-template-columns:repeat(2,1fr)}.two,.split{grid-template-columns:1fr}.shot-list{grid-template-columns:1fr}.page-head h1{font-size:21px}.template-grid{grid-template-columns:1fr}}@media print{.top,.side,.btn,.modal,.toast{display:none!important}.app{padding:0}.layout{display:block}.card{border:1px solid #ccc;margin:8px 0}.print-only{display:block}}
</style></head><body><div class="app"><header class="top"><div class="mark">P</div><div class="brand">prompt<b>or</b></div><select id="projectSelect" class="project-switch" aria-label="Choose project"></select><div class="top-actions"><button class="btn" id="themeBtn">Night mode</button><button class="btn" id="newBtn">New project</button><button class="btn primary" id="briefBtn">Storyboard brief</button></div></header><div class="layout"><aside class="side"><div class="project-note"><div class="eyebrow">Current project</div><b id="sideTitle"></b><span id="sideMeta"></span></div><nav class="nav" id="nav"></nav><div class="side-bottom"><button class="btn" id="exportBtn">Export & share</button></div></aside><main class="content"><div class="page-head"><div><h1 id="pageTitle"></h1><p id="pageSub"></p></div></div><section id="view"></section></main></div></div><div class="modal" id="modal"></div><div class="toast" id="toast"></div>
<script>
const K='promptor.stories.v2', AK='promptor.active.v2', TK='promptor.theme.v2';
const navs=[['overview','01','Overview'],['story','02','Characters & places'],['script','03','Story'],['board','04','Storyboard'],['refs','05','References'],['animation','06','Animation']];
const qs=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function uid(){return Math.random().toString(36).slice(2,10)}function baseProject(type='Short film'){let product=type==='Product video';return {id:uid(),type,title:product?'Untitled product film':'Untitled story',logline:product?'Introduce a product through a short, memorable visual story.':'Describe the story you want to tell.',genre:product?'Product campaign':'Drama',format:'9:16',style:product?'Natural product photography, clean surfaces, warm daylight, tactile detail.':'Grounded cinematic storytelling, natural light, human emotion.',script:'',characters:product?[]:[{id:uid(),name:'Lead character',role:'Protagonist',description:'Describe how they look, dress, and move.',lock:'Keep their face, hairstyle, wardrobe and key details consistent.'}],locations:product?[]:[{id:uid(),name:'Main location',description:'Describe the place, time of day, weather and mood.'}],props:[],references:[],product:{name:'',category:'Skincare & beauty',appearance:'',features:[],lock:'',useCase:'Lifestyle product story',format:'',asset:''},shots:product?productShots():storyShots(),created:Date.now(),updated:Date.now()}}
function storyShots(){return [{id:uid(),scene:'Scene 1',title:'Opening moment',duration:'5 sec',purpose:'Introduce the world and the feeling.',action:'The main character enters the scene.',framing:'Wide establishing shot',camera:'Slow push-in',emotion:'Curious',audio:'Natural ambience',status:'Draft',image:'',clip:'',comments:''},{id:uid(),scene:'Scene 1',title:'The turning point',duration:'5 sec',purpose:'Reveal the story beat that changes everything.',action:'The character notices something important.',framing:'Medium portrait',camera:'Still frame',emotion:'Surprised',audio:'Quiet room tone',status:'Draft',image:'',clip:'',comments:''}]}
function productShots(use='Lifestyle product story'){let sets={"Lifestyle product story":[['Hero reveal','The product appears naturally in a beautiful everyday setting.'],['Detail moment','A close view reveals its material, finish, and key feature.'],['Use moment','A person uses the product in one simple, believable action.'],['Benefit moment','Show the result or feeling the product creates.'],['Closing packshot','Hold the product in a clear final frame.']],"Skincare routine":[['Hero bottle','Reveal the bottle on a calm vanity surface.'],['Texture close-up','Show the formula, texture, and light on the product.'],['Application','Show one natural application motion.'],['Skin benefit','Show the fresh, hydrated result.'],['Closing packshot','End with a simple clean product frame.']],"Food & beverage":[['Fresh reveal','Introduce the product with fresh visual energy.'],['Ingredient detail','Show ingredients or texture in close-up.'],['Pour or serve','Show a satisfying pour, open, or serve action.'],['Share moment','Place the product in a human social moment.'],['Closing packshot','End with a crisp branded product frame.']],"Technology demo":[['Design reveal','Reveal the device shape and build quality.'],['Feature close-up','Show the most important physical feature.'],['In use','Show a person using one core function.'],['Benefit moment','Show the everyday outcome it creates.'],['Closing product frame','End with a clear product view.']]};return (sets[use]||sets['Lifestyle product story']).map((x,i)=>({id:uid(),scene:'Product sequence',title:x[0],duration:i===2?'6 sec':'4 sec',purpose:'Product campaign shot.',action:x[1],framing:i===1?'Macro close-up':'Medium product shot',camera:i===1?'Slow macro slide':'Gentle push-in',emotion:'Confident',audio:'Soft natural ambience',status:'Draft',image:'',clip:'',comments:'',feature:''}))}
let projects=JSON.parse(localStorage.getItem(K)||'null')||[baseProject()], activeId=localStorage.getItem(AK)||projects[0].id, page='overview', selectedId=null, promptTab='image', theme=localStorage.getItem(TK)||'day';
function project(){return projects.find(x=>x.id===activeId)||projects[0]}function save(){project().updated=Date.now();localStorage.setItem(K,JSON.stringify(projects));localStorage.setItem(AK,activeId)}function toast(t){qs('toast').textContent=t;qs('toast').classList.add('show');setTimeout(()=>qs('toast').classList.remove('show'),1800)}function setTheme(){document.documentElement.dataset.theme=theme;localStorage.setItem(TK,theme);qs('themeBtn').textContent=theme==='day'?'Night mode':'Day mode'}
function promptFor(s,kind='image'){let p=project(), c=p.characters.map(x=>x.description).filter(Boolean).join(' '),l=p.locations[0]?.description||'', prod=p.product;let productText=prod.name?`${prod.name}, ${prod.category}. ${prod.appearance}. ${s.feature?`Feature to highlight: ${s.feature}.`:''} Keep consistent: ${prod.lock||'product silhouette, label placement, logo and proportions'}.`:'';let core=`${p.format} ${kind==='image'?'storyboard image':'animation prompt'}. ${productText||c} ${s.action} Setting: ${l||'the story setting'}. Framing: ${s.framing}. Camera: ${s.camera}. Mood: ${s.emotion}. Visual style: ${p.style}.`;return kind==='image'?`${core} Clear composition, natural detail, believable materials, no text overlays. --ar ${prod.name&&prod.format?prod.format:p.format}`:`${core} Duration: ${s.duration}. Audio: ${s.audio}. Keep continuity with the previous shot. Natural movement and realistic physics. Avoid distorted hands, duplicate objects, changing wardrobe, warped labels, captions, and visual flicker.`}
function quality(){let p=project(), out=[];out.push([!!p.title&&!!p.logline,'Give the project a title and a clear logline']);out.push([p.characters.length>0||!!p.product.name,'Add a character or product']);out.push([p.locations.length>0||!!p.product.name,'Add a place or product setting']);out.push([p.shots.length>0,'Create storyboard shots']);out.push([p.shots.every(s=>s.image)||p.shots.length===0,'Attach storyboard images to every shot']);return out}
function renderShell(){let p=project();qs('projectSelect').innerHTML=projects.map(x=>`<option value="${x.id}" ${x.id===activeId?'selected':''}>${esc(x.title)}</option>`).join('');qs('sideTitle').textContent=p.title;qs('sideMeta').textContent=`${p.genre} · ${p.format}`;qs('nav').innerHTML=navs.map(n=>`<button data-page="${n[0]}" class="${page===n[0]?'on':''}"><i>${n[1]}</i>${n[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});qs('projectSelect').onchange=e=>{activeId=e.target.value;selectedId=null;render()};setTheme()}
function overview(){let p=project(), q=quality(), done=q.filter(x=>x[0]).length, next=q.find(x=>!x[0]);return `<div class="grid"><section class="card"><div class="eyebrow">Your project</div><h2 style="font-size:22px;margin:6px 0">${esc(p.title)}</h2><p class="sub" style="max-width:650px">${esc(p.logline)}</p><div class="progress"><i style="width:${Math.round(done/q.length*100)}%"></i></div><p class="sub">${done} of ${q.length} story basics in place</p><div class="next"><b>${next?'A good next step':'You are ready to make your storyboard.'}</b><span>${next?next[1]:'Review the storyboard and choose your strongest frames.'}</span></div><div style="margin-top:14px;display:flex;gap:7px"><button class="btn primary" data-go="${p.shots.length?'board':'story'}">${p.shots.length?'Continue storyboarding':'Shape the story'}</button><button class="btn" data-go="script">Turn story into shots</button></div></section><aside class="card"><h3>At a glance</h3><div class="stats"><div class="stat"><b>${p.characters.length}</b><span>characters</span></div><div class="stat"><b>${p.locations.length}</b><span>places</span></div><div class="stat"><b>${p.shots.length}</b><span>shots</span></div><div class="stat"><b>${p.shots.filter(s=>s.status==='Approved').length}</b><span>approved</span></div></div><h3 style="margin-top:17px">Things to check</h3><div class="check">${q.map(x=>`<div><span>${x[1]}</span><b class="${x[0]?'ok':'todo'}">${x[0]?'Done':'Next'}</b></div>`).join('')}</div></aside></div>`}
function story(){let p=project();return `<div class="grid"><section class="card"><h2>People, places & props</h2><p class="sub">Keep only the details that matter from one image or shot to the next.</p><div class="field"><label>Characters</label><div class="library">${records('characters',p.characters,'character')}</div><button class="btn" data-add="characters">Add character</button></div><div class="field"><label>Places</label><div class="library">${records('locations',p.locations,'place')}</div><button class="btn" data-add="locations">Add place</button></div><div class="field"><label>Important props</label><div class="library">${records('props',p.props,'prop')}</div><button class="btn" data-add="props">Add prop</button></div></section><aside class="card"><h3>Keep it simple</h3><p class="sub">Only add a lock when it must remain the same. A short, clear description works better than a long list.</p><div class="notice" style="margin-top:13px">Example: <b>“Amara has long braids, gold hoops, a cream trench coat, and a small scar above her left eyebrow.”</b></div></aside></div>`}
function records(key,arr,type){if(!arr.length)return '<div class="empty">Nothing added yet.</div>';return arr.map(x=>`<div class="record"><b>${esc(x.name)}</b><p>${esc(x.description)}</p>${x.lock?`<span class="tag">Keep consistent</span>`:''}<div class="record-actions"><button class="btn small" data-edit-record="${key}:${x.id}">Edit</button><button class="btn small" data-remove-record="${key}:${x.id}">Remove</button></div></div>`).join('')}
function script(){let p=project();return `<div class="grid"><section class="card"><h2>Tell the story</h2><p class="sub">Paste a short outline or full script. Promptor turns it into a clear ChatGPT request, not a technical prompt.</p><div class="field"><textarea class="area" style="min-height:280px" id="scriptText" placeholder="What happens in your story?">${esc(p.script)}</textarea></div><div style="display:flex;gap:7px"><button class="btn primary" id="briefLocal">Create a ChatGPT shot-list brief</button><button class="btn" id="makeStarter">Make a starter storyboard</button></div><div class="field"><label>Import a ChatGPT shot list <span class="hint">paste JSON when ChatGPT returns it</span></label><textarea class="area" id="jsonIn" placeholder='{"shots":[{"title":"Opening moment","duration":"5 sec","action":"..."}]}'></textarea><button class="btn" id="importJson">Import shots</button></div></section><aside class="card"><h3>A useful ChatGPT request</h3><p class="sub">Ask for short, visual shots. One clear action per shot makes later animation easier.</p><pre class="prompt">${esc(briefText())}</pre><button class="btn" id="copyBrief">Copy brief</button></aside></div>`}
function briefText(){let p=project();return `You are helping me plan a ${p.format} ${p.genre} storyboard.\n\nTitle: ${p.title}\nLogline: ${p.logline}\nStyle: ${p.style}\n\nStory:\n${p.script||'[paste story here]'}\n\nReturn a JSON object with a shots array. Every shot needs title, duration, purpose, action, framing, camera_movement, emotion, and audio. Keep each shot 4–8 seconds. Use clear human actions and preserve character, place, prop, and product consistency.`}
function board(){let p=project(), s=p.shots.find(x=>x.id===selectedId)||p.shots[0];if(!s)return `<section class="card"><h2>Your storyboard is empty</h2><p class="sub">Add a shot, or create a starter storyboard from the Story page.</p><button class="btn primary" id="makeStarter">Create starter storyboard</button></section>`;return `<div class="storyboard"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Shots</h2><p class="sub">Drag to reorder</p></div><button class="btn small" id="addShot">Add shot</button></div><div class="shot-list" id="shotList">${p.shots.map((x,i)=>`<article draggable="true" data-shot="${x.id}" class="shot ${x.id===s.id?'on':''}"><div class="shot-top"><strong>${String(i+1).padStart(2,'0')} · ${esc(x.title)}</strong><small>${x.duration}</small></div><p>${esc(x.action)}</p>${x.image?`<img src="${x.image}" alt="Storyboard frame">`:''}<span class="tag">${x.status}</span></article>`).join('')}</div></section><section class="card shot-detail"><div class="detail-title"><div><div class="eyebrow">${esc(s.scene)} · ${s.duration}</div><h2>${esc(s.title)}</h2><p class="sub">${esc(s.purpose)}</p></div><select id="statusSelect" style="width:130px"><option ${s.status==='Draft'?'selected':''}>Draft</option><option ${s.status==='Prompt ready'?'selected':''}>Prompt ready</option><option ${s.status==='Storyboard made'?'selected':''}>Storyboard made</option><option ${s.status==='Approved'?'selected':''}>Approved</option><option ${s.status==='Animated'?'selected':''}>Animated</option></select></div><div class="shot-image">${s.image?`<img src="${s.image}" alt="Storyboard frame">`:'Add a storyboard frame when you have one'}</div><div class="drop"><span>▧</span><span>${s.image?'Replace storyboard image':'Attach storyboard image'}</span><label>Choose image<input type="file" accept="image/*" data-file="image"></label></div><div class="tabs"><button class="${promptTab==='image'?'on':''}" data-tab="image">Image prompt</button><button class="${promptTab==='animation'?'on':''}" data-tab="animation">Animation prompt</button><button class="${promptTab==='notes'?'on':''}" data-tab="notes">Shot details</button></div>${promptTab==='notes'?shotForm(s):`<pre class="prompt">${esc(promptFor(s,promptTab))}</pre><div style="display:flex;gap:7px"><button class="btn primary" id="copyPrompt">Copy prompt</button><button class="btn" id="editShot">Edit shot</button></div>`}<div class="field"><label>Notes for you or your team</label><textarea class="area" id="commentText" placeholder="What should be checked or changed before the next step?">${esc(s.comments)}</textarea></div><div class="drop"><span>▸</span><span>${s.clip?'Replace selected animation clip':'Attach selected animation clip'}</span><label>Choose clip<input type="file" accept="video/*" data-file="clip"></label></div></section></div>`}
function shotForm(s){return `<div class="split"><div class="field"><label>Scene</label><input class="input" data-shot-field="scene" value="${esc(s.scene)}"></div><div class="field"><label>Duration</label><input class="input" data-shot-field="duration" value="${esc(s.duration)}"></div><div class="field"><label>Framing</label><input class="input" data-shot-field="framing" value="${esc(s.framing)}"></div><div class="field"><label>Camera movement</label><input class="input" data-shot-field="camera" value="${esc(s.camera)}"></div></div><div class="field"><label>What happens</label><textarea class="area" data-shot-field="action">${esc(s.action)}</textarea></div><div class="split"><div class="field"><label>Emotion</label><input class="input" data-shot-field="emotion" value="${esc(s.emotion)}"></div><div class="field"><label>Audio</label><input class="input" data-shot-field="audio" value="${esc(s.audio)}"></div></div><button class="btn primary" id="saveShot">Save changes</button>`}
function refs(){let p=project();let all=[...p.characters.map(x=>['Character',x]),...p.locations.map(x=>['Place',x]),...p.props.map(x=>['Prop',x])];return `<div class="grid"><section class="card"><h2>Your visual references</h2><p class="sub">Upload character, place, prop, product, or style references. These stay in this browser and can be used while generating images elsewhere.</p><div class="library">${all.map(([type,x])=>`<div class="record"><b>${esc(x.name)} <span class="tag">${type}</span></b><p>${x.asset?'Reference attached':'No reference image yet'}</p>${x.asset?`<img src="${x.asset}" style="width:100%;height:100px;object-fit:cover;border-radius:5px">`:''}<div class="drop"><label>Attach<input type="file" accept="image/*" data-ref="${type}:${x.id}"></label></div></div>`).join('')||'<div class="empty">Add characters, places, or props first.</div>'}</div></section><aside class="card"><h3>Reference checklist</h3><div class="check"><div><span>Characters with images</span><b>${p.characters.filter(x=>x.asset).length}/${p.characters.length}</b></div><div><span>Places with images</span><b>${p.locations.filter(x=>x.asset).length}/${p.locations.length}</b></div><div><span>Storyboard frames</span><b>${p.shots.filter(x=>x.image).length}/${p.shots.length}</b></div></div><div class="next"><b>Use references in the same ChatGPT conversation</b><span>That is the simplest way to keep the look consistent before animation.</span></div></aside></div>`}
function animation(){let p=project(),q=p.product, isProduct=!!q.name;return `<div class="grid"><section class="card"><h2>${isProduct?'Product animation':'Ready to animate'}</h2><p class="sub">Use this space for product campaigns, or review the story prompts before moving into your animation tool.</p><div class="field"><label>Product name</label><input class="input" data-product="name" value="${esc(q.name)}" placeholder="e.g. Zuri Glow Serum"></div><div class="two"><div class="field"><label>Product category</label><select data-product="category">${['Skincare & beauty','Fragrance','Beverage','Food & snacks','Fashion','Technology','Home & lifestyle','Other'].map(x=>`<option ${q.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Frame shape</label><select data-product="format"><option value="">Use project format (${p.format})</option>${['9:16','4:5','1:1','16:9','3:4'].map(x=>`<option ${q.format===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>What kind of product story?</label><select data-product="useCase"><option ${q.useCase==='Lifestyle product story'?'selected':''}>Lifestyle product story</option><option ${q.useCase==='Skincare routine'?'selected':''}>Skincare routine</option><option ${q.useCase==='Food & beverage'?'selected':''}>Food & beverage</option><option ${q.useCase==='Technology demo'?'selected':''}>Technology demo</option></select></div><div class="field"><label>Product appearance, packaging & finish</label><textarea class="area" data-product="appearance" placeholder="Frosted glass bottle, soft label, brushed gold cap…">${esc(q.appearance)}</textarea></div><div class="field"><label>Product features</label><div style="display:flex;gap:7px"><input class="input" id="featureIn" placeholder="e.g. 24-hour hydration"><button class="btn" id="addFeature">Add</button></div>${q.features.map(f=>`<span class="tag" data-remove-feature="${esc(f)}">${esc(f)} ×</span>`).join('')}</div><div class="field"><label>Keep this product consistent</label><textarea class="area" data-product="lock" placeholder="Keep the label, shape, logo and cap the same…">${esc(q.lock)}</textarea></div><button class="btn primary" id="buildProduct">Build product sequence</button></section><aside class="card"><h3>Feature coverage</h3><p class="sub">Choose the main feature each product shot should show.</p>${p.product.name?`<table class="matrix"><tr><th>Shot</th><th>Feature</th></tr>${p.shots.map(s=>`<tr><td>${esc(s.title)}</td><td><select data-feature-shot="${s.id}"><option value="">Choose feature</option>${q.features.map(f=>`<option ${s.feature===f?'selected':''}>${esc(f)}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<div class="empty">Add a product name, then build a product sequence.</div>'}<div class="next"><b>Before you animate</b><span>Approve a storyboard frame, then use its image and the matching animation prompt together.</span></div></aside></div>`}
function exportView(){let p=project();return `<section class="card"><h2>Export this project</h2><p class="sub">Save a working copy, share a shot list, or print a simple storyboard review.</p><div class="library"><div class="record"><b>Project JSON</b><p>Backup everything in this browser project.</p><button class="btn small" id="jsonExport">Download JSON</button></div><div class="record"><b>Shot list CSV</b><p>Open your production plan in a spreadsheet.</p><button class="btn small" id="csvExport">Download CSV</button></div><div class="record"><b>Prompt pack</b><p>One text file with image and animation prompts.</p><button class="btn small" id="textExport">Download prompts</button></div><div class="record"><b>Printable storyboard</b><p>Use your browser’s print dialog to save a PDF.</p><button class="btn small" id="printExport">Print / save PDF</button></div></div></section>`}
function render(){renderShell();let meta={overview:['Overview','Start with the story, then take one clear next step.'],story:['Characters & places','Add only the details that need to stay consistent.'],script:['Story','Turn a simple outline into a useful shot list.'],board:['Storyboard','See the story one short, visual moment at a time.'],refs:['References','Keep images close to the people, places, and products they describe.'],animation:['Animation','Plan the product or story shots you are ready to animate.'],export:['Export','Save your project, prompt pack, or printable shot list.']}[page];qs('pageTitle').textContent=meta[0];qs('pageSub').textContent=meta[1];qs('view').innerHTML=({overview,story,script,board,refs,animation,export:exportView}[page]||overview)();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addRecord(b.dataset.add));document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>editRecord(...b.dataset.editRecord.split(':')));document.querySelectorAll('[data-remove-record]').forEach(b=>b.onclick=()=>removeRecord(...b.dataset.removeRecord.split(':')));qs('scriptText')?.addEventListener('input',e=>{project().script=e.target.value;save()});qs('briefLocal')?.addEventListener('click',()=>openBrief());qs('copyBrief')?.addEventListener('click',()=>copy(briefText(),'Brief copied'));document.querySelectorAll('#makeStarter').forEach(b=>b.onclick=()=>{if(!project().shots.length)project().shots=storyShots();save();page='board';render()});qs('importJson')?.addEventListener('click',importJSON);qs('addShot')?.addEventListener('click',()=>{project().shots.push({...storyShots()[0],id:uid(),title:'New shot'});save();render()});document.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.shot;render()});dragShots();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{promptTab=b.dataset.tab;render()});qs('copyPrompt')?.addEventListener('click',()=>copy(promptFor(selected(),promptTab)));qs('editShot')?.addEventListener('click',()=>{promptTab='notes';render()});qs('saveShot')?.addEventListener('click',()=>{let s=selected();document.querySelectorAll('[data-shot-field]').forEach(e=>s[e.dataset.shotField]=e.value);save();promptTab='image';render();toast('Shot saved')});qs('statusSelect')?.addEventListener('change',e=>{selected().status=e.target.value;save();render()});qs('commentText')?.addEventListener('input',e=>{selected().comments=e.target.value;save()});document.querySelectorAll('[data-file]').forEach(i=>i.onchange=()=>readFile(i.files[0],v=>{selected()[i.dataset.file]=v;save();render()}));document.querySelectorAll('[data-ref]').forEach(i=>i.onchange=()=>readFile(i.files[0],v=>{let [type,id]=i.dataset.ref.split(':');let key={Character:'characters',Place:'locations',Prop:'props'}[type];project()[key].find(x=>x.id===id).asset=v;save();render()}));document.querySelectorAll('[data-product]').forEach(e=>e.oninput=()=>{project().product[e.dataset.product]=e.value;save()});qs('addFeature')?.addEventListener('click',()=>{let v=qs('featureIn').value.trim();if(v&&!project().product.features.includes(v)){project().product.features.push(v);save();render()}});document.querySelectorAll('[data-remove-feature]').forEach(e=>e.onclick=()=>{project().product.features=project().product.features.filter(x=>x!==e.dataset.removeFeature);save();render()});qs('buildProduct')?.addEventListener('click',()=>{let p=project();if(!p.product.name){toast('Add a product name first');return}p.shots=productShots(p.product.useCase);selectedId=p.shots[0].id;save();page='board';render()});document.querySelectorAll('[data-feature-shot]').forEach(e=>e.onchange=()=>{project().shots.find(s=>s.id===e.dataset.featureShot).feature=e.value;save();toast('Feature assigned')});qs('jsonExport')?.addEventListener('click',()=>download(`${safe(project().title)}.json`,JSON.stringify(project(),null,2),'application/json'));qs('csvExport')?.addEventListener('click',exportCSV);qs('textExport')?.addEventListener('click',exportText);qs('printExport')?.addEventListener('click',()=>window.print())}
function selected(){return project().shots.find(x=>x.id===selectedId)||project().shots[0]}function dragShots(){let list=qs('shotList');if(!list)return;let from=null;list.querySelectorAll('[draggable]').forEach(el=>{el.ondragstart=()=>{from=el.dataset.shot;el.classList.add('drag')};el.ondragend=()=>el.classList.remove('drag');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let to=el.dataset.shot,p=project(),a=p.shots.findIndex(x=>x.id===from),b=p.shots.findIndex(x=>x.id===to);if(a<0||b<0||a===b)return;p.shots.splice(b,0,p.shots.splice(a,1)[0]);save();render()}})}
function addRecord(key){let name=prompt(`Name this ${key==='characters'?'character':key==='locations'?'place':'prop'}:`);if(!name)return;let desc=prompt('Describe it in a few visual details:')||'';let x={id:uid(),name,description:desc,asset:''};if(key==='characters')x.lock=prompt('What should stay consistent?')||'';project()[key].push(x);save();render()}function editRecord(key,id){let x=project()[key].find(x=>x.id===id);let d=prompt('Description:',x.description);if(d===null)return;x.description=d;if(key==='characters'){let l=prompt('Keep consistent:',x.lock);if(l!==null)x.lock=l}save();render()}function removeRecord(key,id){if(confirm('Remove this record?')){project()[key]=project()[key].filter(x=>x.id!==id);save();render()}}function importJSON(){try{let raw=qs('jsonIn').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let x=JSON.parse(raw),arr=Array.isArray(x)?x:x.shots;if(!Array.isArray(arr))throw Error('Expected a shots array');project().shots=arr.map((s,i)=>({id:uid(),scene:s.scene||'Scene 1',title:s.title||s.shot_title||`Shot ${i+1}`,duration:s.duration||'5 sec',purpose:s.purpose||'Advance the story.',action:s.action||s.visible_action||'',framing:s.framing||'Medium shot',camera:s.camera_movement||s.camera||'Slow push-in',emotion:s.emotion||s.emotional_beat||'Natural',audio:s.audio||s.sound||'Natural ambience',status:'Draft',image:'',clip:'',comments:'',feature:''}));selectedId=project().shots[0]?.id;save();page='board';render();toast('Shot list imported')}catch(e){toast('Could not read that JSON')}}function readFile(file,done){if(!file)return;let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}function copy(t,msg='Copied'){navigator.clipboard?.writeText(t).then(()=>toast(msg)).catch(()=>toast('Select and copy the text manually'))}function safe(s){return s.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}function download(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportCSV(){let rows=[['Scene','Shot','Duration','Purpose','Action','Framing','Camera','Status'],...project().shots.map(s=>[s.scene,s.title,s.duration,s.purpose,s.action,s.framing,s.camera,s.status])];download(`${safe(project().title)}-shots.csv`,rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')}function exportText(){let p=project(),t=p.shots.map((s,i)=>`SHOT ${i+1} — ${s.title}\nIMAGE PROMPT\n${promptFor(s,'image')}\n\nANIMATION PROMPT\n${promptFor(s,'animation')}`).join('\n\n'+'═'.repeat(32)+'\n\n');download(`${safe(p.title)}-prompts.txt`,t)}function openBrief(){qs('modal').innerHTML=`<div class="modal-body"><div class="modal-head"><h2>ChatGPT storyboard brief</h2><button class="btn small" id="closeModal">Close</button></div><p class="sub">Copy this into ChatGPT, then bring the returned JSON shot list back into Promptor.</p><pre class="prompt">${esc(briefText())}</pre><button class="btn primary" id="modalCopy">Copy brief</button></div>`;qs('modal').classList.add('show');qs('closeModal').onclick=()=>qs('modal').classList.remove('show');qs('modalCopy').onclick=()=>copy(briefText(),'Brief copied')}function newProject(){qs('modal').innerHTML=`<div class="modal-body"><div class="modal-head"><h2>What are you making?</h2><button class="btn small" id="closeModal">Close</button></div><p class="sub">Choose a starting point. You can change every detail later.</p><div class="template-grid"><button class="template" data-template="Short film"><b>Short film</b><span>A character-led visual story</span></button><button class="template" data-template="Product video"><b>Product video</b><span>A product campaign or advert</span></button><button class="template" data-template="Social story"><b>Social story</b><span>A short vertical story for social</span></button><button class="template" data-template="Music video"><b>Music video</b><span>A visual sequence built around a song</span></button></div></div>`;qs('modal').classList.add('show');qs('closeModal').onclick=()=>qs('modal').classList.remove('show');document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{let p=baseProject(b.dataset.template);if(b.dataset.template==='Social story'){p.format='9:16';p.genre='Social story'}if(b.dataset.template==='Music video'){p.genre='Music video';p.style='Expressive visual storytelling, rhythm, movement, and strong atmosphere.'}projects.push(p);activeId=p.id;selectedId=null;qs('modal').classList.remove('show');page='overview';save();render()})}
qs('newBtn').onclick=newProject;qs('briefBtn').onclick=openBrief;qs('themeBtn').onclick=()=>{theme=theme==='day'?'night':'day';setTheme()};qs('exportBtn').onclick=()=>{page='export';render()};setTheme();render();
</script></body></html>
